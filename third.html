<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Event</title>
</head>
<body>

    <h1>College Technical Event 2026</h1>

    <p>Welcome to our College Technical Event!</p>

    <h2>Event Details</h2>

    <p><b>Date:</b> 15 November 2026</p>
    <p><b>Time:</b> 10:00 AM</p>
    <p><b>Venue:</b> Marwadi University Auditorium</p>

    <h2>Event Image</h2>

    <a href="#registration">
        <img
            src="event.jpg/event.jpg"
            alt="Technical Event Image"
            width="300">
    </a>

    <p>Click the image to go to the registration section.</p>

    <h2 id="registration">Event Registration</h2>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile" required>
        <br><br>

        <input type="submit" value="Register">
    </form>

</body>
</html>
